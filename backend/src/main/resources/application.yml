spring:
  profiles:
    default: local
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  application:
    name: career-platform-api
  datasource:
    url: jdbc:h2:file:./data/careerpath;MODE=PostgreSQL;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      enabled: false

server:
  port: 8080

app:
  security:
    jwt-secret: ${JWT_SECRET:}
    jwt-expiration-hours: 24

management:
  endpoints:
    web:
      exposure:
        include: health,info
